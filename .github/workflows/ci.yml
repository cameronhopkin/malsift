name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No apt step: the yara-python wheel bundles libyara, and libmagic is already on
      # GitHub's Ubuntu runners (MalSift falls back to magic-byte typing without it).
      - name: Install package (editable, with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q -rs

      - name: Smoke run (static, no LLM)
        run: |
          printf 'MZ' > /tmp/smoke.bin
          head -c 512 /dev/urandom >> /tmp/smoke.bin
          malsift analyze /tmp/smoke.bin --no-llm --no-write

  install:
    name: non-editable install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A dedicated venv, so nothing else on the runner can shadow the installed copy.
      - name: pip install . (regular, non-editable) into a fresh venv
        run: |
          python -m venv "$GITHUB_WORKSPACE/.venv-install"
          echo "$GITHUB_WORKSPACE/.venv-install/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv-install/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/.venv-install/bin/pip" install . pytest pyyaml setuptools wheel

      - name: Package data is installed with the package
        working-directory: /tmp
        run: |
          python - <<'PY'
          import malsift
          from malsift import resources
          assert "site-packages" in malsift.__file__, malsift.__file__
          for p in (resources.config_dir() / "default.yaml",
                    resources.prompts_dir() / "analyze.txt",
                    resources.rules_dir() / "poison_indicators.yar",
                    resources.seccomp_profile()):
              assert p.is_file(), p
              print("ok", p)
          PY

      - name: Run outside the source tree
        working-directory: /tmp
        run: |
          printf 'MZ\0http://update-check.example.net/beacon\0' > /tmp/smoke.bin
          malsift analyze /tmp/smoke.bin --no-llm --format both --out /tmp/reports
          ls -l /tmp/reports

      # Plain `pytest` (not `python -m pytest`) does not put the repo root on sys.path,
      # so `import malsift` resolves to the installed copy; the env var makes a test
      # assert exactly that.
      - name: Tests against the installed package
        env:
          MALSIFT_EXPECT_INSTALLED: "1"
        run: pytest -q -rs

  container:
    name: hardened analyzer container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build analyzer image
        run: docker build -f Dockerfile.analyzer -t malsift-analyzer:latest .

      - name: Validate compose file
        run: SAMPLE=placeholder docker compose config --quiet

      - name: Isolation tests (real container, seccomp, no network)
        env:
          MALSIFT_DOCKER_TESTS: "1"
        run: pytest -q -rs tests/test_isolation.py

      - name: Isolated smoke run
        run: |
          mkdir -p /tmp/samples
          printf 'MZ\0vmtoolsd.exe\0http://c2.example.net/a\0' > /tmp/samples/smoke.bin
          malsift analyze /tmp/samples/smoke.bin --isolate docker --no-llm --format md --out /tmp/reports
          cat /tmp/reports/*.md
