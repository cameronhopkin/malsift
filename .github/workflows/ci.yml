name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libs for static analysis
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libyara9

      - name: Install package (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Smoke run (static, no LLM)
        run: |
          printf 'MZ' > /tmp/smoke.bin
          head -c 512 /dev/urandom >> /tmp/smoke.bin
          malsift analyze /tmp/smoke.bin --no-llm --no-write
