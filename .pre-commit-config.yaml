# Install with: pip install pre-commit && pre-commit install
# The local hook below hard-blocks any tracked file under samples/ except .gitkeep.
repos:
  - repo: local
    hooks:
      - id: block-samples
        name: block live sample commits
        entry: scripts/block_samples.py
        language: python
        always_run: true
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
