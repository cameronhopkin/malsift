[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malsift"
version = "0.2.0"
description = "Self-hosted malware triage that pairs classic static analysis with a local LLM, and quarantines adversarial prompt-injection bait embedded in samples."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cameron Hopkin" }]
keywords = ["malware-analysis", "dfir", "yara", "llm", "triage", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-magic>=0.4.27",
    "pefile>=2024.8.26",
    "yara-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
malsift = "malsift.cli:main"

[tool.setuptools.packages.find]
include = ["malsift*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
